<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiranFlow by Thirenex - Reports</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .report-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-bottom: 15px;
        }
        .report-info h3 { margin-bottom: 5px; font-size: 1.1rem; }
        .report-info p { color: var(--text-muted); font-size: 0.9rem; }
    </style>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand" style="padding: 15px 0; text-align: center;"><img src="logo.png" alt="ThiranFlow Logo" style="max-width: 100%; max-height: 60px;"></div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="linkedin.html">Daily LinkedIn</a></li>
                <li class="admin-only"><a href="users.html">Team Members</a></li>
                <li class="admin-only"><a href="reports.html" class="active">Reports</a></li>
                <li><a href="profile.html">My Profile</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div><span style="font-weight: 500; font-size: 1.1rem;">Data Reports</span></div>
                <div class="header-right">
                    <div style="text-align: right; line-height: 1.2;">
                        <strong id="header-user-name">Loading...</strong><br>
                        <small id="header-user-role" class="text-muted"></small>
                    </div>
                    <button class="btn btn-secondary" id="logout-btn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div style="display: flex; gap: 15px; margin-bottom: 24px;">
                    <button class="btn btn-primary" onclick="downloadReport('performance')">Download Performance CSV</button>
                    <button class="btn btn-secondary" onclick="downloadScoreboardPNG()">Download Scoreboard PNG</button>
                    <button class="btn btn-secondary" onclick="downloadReport('tasks')">Download Tasks CSV</button>
                    <button class="btn btn-secondary" onclick="downloadReport('linkedin')">Download LinkedIn CSV</button>
                </div>

                <div class="card table-responsive" id="scoreboard-container" style="background: white; padding: 20px; border-radius: var(--card-radius);">
                    <h2 style="text-align: center; margin-bottom: 20px; color: var(--text-dark);">Team Performance Scoreboard</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Tasks Assigned</th>
                                <th>Tasks Completed</th>
                                <th>Avg Rating</th>
                                <th>LinkedIn Posts</th>
                            </tr>
                        </thead>
                        <tbody id="performance-tbody">
                            <tr><td colspan="5" style="text-align: center;">Aggregating data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="reports.js"></script>
</body>
</html>
