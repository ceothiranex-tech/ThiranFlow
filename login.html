<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiranFlow by Thirenex - Secure Access</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --corp-blue: #0A2540;
            --corp-accent: #0066FF;
            --corp-gray: #425466;
            --corp-bg: #F0F4F8;
            --corp-light: #FFFFFF;
        }
        
        body.login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--corp-bg) 0%, #D9E2EC 100%);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(10, 37, 64, 0.08), 0 5px 15px rgba(10, 37, 64, 0.03);
            width: 100%;
            max-width: 480px;
            padding: 50px 40px;
            text-align: center;
            color: var(--corp-blue);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo-container img {
            max-width: 200px;
            max-height: 70px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.03);
        }

        .welcome-text {
            margin-bottom: 35px;
        }

        .welcome-text h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: var(--corp-blue);
        }

        .welcome-text p {
            font-size: 1rem;
            color: var(--corp-gray);
            font-weight: 400;
        }

        .role-tabs {
            display: flex;
            background: #E3E8EE;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 30px;
        }

        .role-tab {
            flex: 1;
            padding: 12px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--corp-gray);
            transition: all 0.3s ease;
            z-index: 1;
        }

        .role-tab:hover {
            color: var(--corp-blue);
        }

        .role-tab.active {
            background: var(--corp-light);
            color: var(--corp-accent);
            box-shadow: 0 2px 8px rgba(10, 37, 64, 0.08);
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--corp-blue);
            margin-left: 5px;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            background: var(--corp-light);
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
            color: var(--corp-blue);
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-control::placeholder {
            color: #94A3B8;
        }

        .form-control:focus {
            background: var(--corp-light);
            border-color: var(--corp-accent);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--corp-accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .login-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 102, 255, 0.3);
            background: #0052CC;
        }

        .login-btn:hover::after {
            left: 100%;
        }

        .login-btn:disabled {
            background: #CBD5E1;
            color: #64748B;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); scale: 0.98; }
            to { opacity: 1; transform: translateY(0); scale: 1; }
        }
        
        @media (max-width: 480px) {
            .glass-card {
                padding: 40px 25px;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="manifest" href="manifest.json">
</head>
<body class="login-page">

    <div class="glass-card">
        <div class="logo-container">
            <img src="logo.png" alt="ThiranFlow Logo" onerror="this.src='fav.png'; this.style.maxWidth='80px';">
        </div>

        <div class="welcome-text">
            <h2>Welcome Back</h2>
            <p>Access your corporate dashboard</p>
        </div>

        <div class="role-tabs">
            <div class="role-tab active" data-role="Team Member" id="tab-employee">Member</div>
            <div class="role-tab" data-role="Manager" id="tab-manager">Manager</div>
            <div class="role-tab" data-role="Admin" id="tab-admin">Admin</div>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Corporate Email</label>
                <input type="email" id="email" class="form-control" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="login-btn">Sign In to Dashboard</button>
        </form>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script>
        // Check if already logged in
        if (getCurrentUser()) {
            window.location.replace('dashboard.html');
        }

        // Tab Switching Logic
        let selectedRole = 'Team Member';
        const tabs = document.querySelectorAll('.role-tab');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                tabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                selectedRole = e.target.getAttribute('data-role');
            });
        });

        // Form Submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerHTML = '<span style="display:inline-block; animation: pulse 1s infinite;">Authenticating...</span>';
            btn.disabled = true;

            try {
                const response = await fetchAPI({ action: 'login', email, password });
                
                if (response.success && response.data.Role === selectedRole) {
                    localStorage.setItem('teamflow_user', JSON.stringify(response.data));
                    btn.innerHTML = 'Success! Redirecting...';
                    btn.style.background = '#10B981';
                    setTimeout(() => window.location.replace('dashboard.html'), 800);
                } else if (response.success && response.data.Role !== selectedRole) {
                    alert(`Access denied: You are a ${response.data.Role}, but tried to login as ${selectedRole}`);
                    btn.innerHTML = 'Sign In to Dashboard';
                    btn.disabled = false;
                } else {
                    alert(response.message || 'Login failed');
                    btn.innerHTML = 'Sign In to Dashboard';
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Connection error. Please try again.');
                btn.innerHTML = 'Sign In to Dashboard';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
