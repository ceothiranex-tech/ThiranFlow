<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiranFlow by Thirenex - Team Members</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--white); padding: 32px; border-radius: var(--card-radius); width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: fadeIn 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .close-btn { cursor: pointer; font-size: 1.5rem; font-weight: bold; border: none; background: none; color: var(--text-muted); transition: color 0.2s; }
        .close-btn:hover { color: var(--danger); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
        .form-group-full { grid-column: span 2; }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-blue); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; margin-right: 12px; }
        .user-name-cell { display: flex; align-items: center; font-weight: 600; }
    </style>
    <link rel="icon" type="image/png" href="fav.png">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand" style="padding: 15px 0; text-align: center;"><img src="logo.png" alt="ThiranFlow Logo" style="max-width: 100%; max-height: 60px;"></div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="linkedin.html">Daily LinkedIn</a></li>
                <li class="admin-only"><a href="users.html" class="active">Team Members</a></li>
                <li class="admin-only"><a href="reports.html">Reports</a></li>
                <li><a href="profile.html">My Profile</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div><span style="font-weight: 500; font-size: 1.1rem;">Team Management</span></div>
                <div class="header-right">
                    <div style="text-align: right; line-height: 1.2;">
                        <strong id="header-user-name">Loading...</strong><br>
                        <small id="header-user-role" class="text-muted"></small>
                    </div>
                    <button class="btn btn-secondary" id="logout-btn">Logout</button>
                </div>
            </header>

            <div class="content-area">
                <div class="filter-bar">
                    <button class="btn btn-primary" id="btn-add-user">Add Team Member</button>
                    <input type="text" id="search-user" class="form-control" placeholder="Search by name or email..." style="width: 300px;">
                </div>

                <div class="card table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Employee ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <tr><td colspan="7" style="text-align: center;">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Team Member</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="user-form">
                <input type="hidden" id="form-mode" value="create">
                
                <div class="form-grid">
                    <div class="form-group form-group-full">
                        <label>Name</label>
                        <input type="text" id="user-name" class="form-control" placeholder="e.g. Jane Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text" id="user-empid" class="form-control" placeholder="e.g. EMP001" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="user-email" class="form-control" placeholder="e.g. jane@teamflow.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" id="user-dept" class="form-control" placeholder="e.g. Engineering">
                    </div>

                    <div class="form-group">
                        <label>Designation</label>
                        <input type="text" id="user-desig" class="form-control" placeholder="e.g. Developer">
                    </div>

                    <div class="form-group">
                        <label>Role</label>
                        <select id="user-role" class="form-control" required>
                            <option value="Team Member">Team Member</option>
                            <option value="Manager">Manager</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="user-status" class="form-control" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    
                    <div class="form-group form-group-full" id="password-group">
                        <label>Password</label>
                        <input type="password" id="user-password" class="form-control" placeholder="••••••••">
                        <small class="text-muted" style="display:inline-block; margin-top:5px;" id="password-hint">Leave blank to keep existing password</small>
                    </div>
                </div>

                <div style="text-align: right; margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('user-modal').style.display='none'" style="margin-right: 10px;">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-user">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="users.js"></script>
</body>
</html>
