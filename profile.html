<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiranFlow by Thirenex - My Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-card {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group-full {
            grid-column: span 2;
        }
        .avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-blue), #6366F1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto 20px auto;
            box-shadow: var(--shadow-md);
        }
    </style>
    <link rel="icon" type="image/png" href="fav.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand" style="padding: 15px 0; text-align: center;"><img src="logo.png" alt="ThiranFlow Logo" style="max-width: 100%; max-height: 60px;"></div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="tasks.html">Tasks</a></li>
                <li><a href="linkedin.html">Daily LinkedIn</a></li>
                <li class="admin-only d-none"><a href="users.html">Team Members</a></li>
                <li class="admin-only d-none"><a href="reports.html">Reports</a></li>
                <li><a href="profile.html" class="active">My Profile</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div><span style="font-weight: 500; font-size: 1.1rem;">My Profile</span></div>
                <div class="header-right">
                    <div style="text-align: right; line-height: 1.2;">
                        <strong id="header-user-name">Loading...</strong><br>
                        <small id="header-user-role" class="text-muted"></small>
                    </div>
                    <button class="btn btn-secondary" id="logout-btn">Logout</button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="card glass profile-card">
                    <div id="profile-avatar" class="avatar-lg">U</div>
                    <h2 style="text-align: center; margin-bottom: 24px;">Personal Information</h2>
                    
                    <form id="profile-form">
                        <div class="form-grid">
                            <div class="form-group form-group-full">
                                <label>Full Name</label>
                                <input type="text" id="prof-name" class="form-control" required>
                            </div>

                            <div class="form-group form-group-full">
                                <label>Email Address</label>
                                <input type="email" id="prof-email" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Employee ID</label>
                                <input type="text" id="prof-empid" class="form-control" disabled>
                            </div>
                            
                            <div class="form-group">
                                <label>Role</label>
                                <input type="text" id="prof-role" class="form-control" disabled>
                            </div>
                            
                            <div class="form-group">
                                <label>Department</label>
                                <input type="text" id="prof-dept" class="form-control" disabled>
                            </div>
                            
                            <div class="form-group">
                                <label>Designation</label>
                                <input type="text" id="prof-desig" class="form-control" disabled>
                            </div>

                            <div class="form-group form-group-full" style="margin-top: 10px;">
                                <label>Update Password</label>
                                <input type="password" id="prof-password" class="form-control" placeholder="••••••••">
                                <small class="text-muted">Leave blank to keep your current password</small>
                            </div>
                        </div>

                        <div style="text-align: right; margin-top: 30px;">
                            <button type="submit" class="btn btn-primary" id="btn-save-profile" style="width: 100%;">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="profile.js"></script>
</body>
</html>
